name: Generate contribution snake

on:
  schedule:
    # Each day at 03:17 UTC. The snake then shows the newest contributions.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Colors come from assets/header-light.svg and assets/header-dark.svg:
      # green for the dots (the candles), blue for the snake (the forecast line).
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2f6fe8&color_dots=#ebedf0,#a7e3cb,#5cc79f,#12a170,#0b7350
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4d8dff&color_dots=#161b22,#0e3d2e,#157255,#1ca476,#22c38e&color_dot_border=#ffffff0d

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
